<!-- Widget Streamlabs « Objectif de dons » — onglet HTML -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="gPiece" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FFF6B0"/><stop offset=".45" stop-color="#FFD21F"/><stop offset="1" stop-color="#B98200"/>
    </radialGradient>
    <symbol id="piece" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#8a6100"/>
      <circle cx="32" cy="30" r="29" fill="url(#gPiece)"/>
      <circle cx="32" cy="30" r="22" fill="none" stroke="#a87700" stroke-width="2.5" stroke-dasharray="3 3"/>
      <g fill="#8a6100">
        <ellipse cx="32" cy="37" rx="9.5" ry="7.5"/>
        <ellipse cx="21.5" cy="27" rx="4" ry="5"/>
        <ellipse cx="28" cy="21" rx="4" ry="5.2"/>
        <ellipse cx="36" cy="21" rx="4" ry="5.2"/>
        <ellipse cx="42.5" cy="27" rx="4" ry="5"/>
      </g>
    </symbol>
    <symbol id="bottes" viewBox="0 0 24 24">
      <path d="M6 3h5v9l2 2h5a3 3 0 0 1 3 3v2H4v-3l2-2z" fill="#3EE03A"/>
      <rect x="3" y="19" width="19" height="2.5" rx="1" fill="#1FA81C"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <div class="neon-vert"></div>
  <div class="neon-vert2"></div>

  <div class="panel">
    <div class="contenu">
      <div class="titre-ligne">
        <div class="titre">
          <h1>Donation Goals</h1>
          <span class="tag jaune">Team Chat</span>
          <span class="tag">G4P 2026</span>
        </div>
        <div class="montant" id="montant">0 €</div>
      </div>

      <div class="barre-zone">
        <div class="barre"><div class="remplissage" id="remplissage"></div><div id="marqueurs"></div></div>
        <svg class="piece" id="curseur"><use href="#piece"/></svg>
      </div>
      <div class="etiquettes" id="etiquettes"></div>

      <div class="bas">
        <div class="prochain"><span class="lbl" id="lbl">Prochain palier</span><span class="obj" id="obj"></span></div>
        <div class="km"><svg><use href="#bottes"/></svg><span><b id="km">0</b> km à marcher</span></div>
      </div>
    </div>

    <div class="celeb" id="celeb">
      <div class="gauche"><div class="debloque">Palier débloqué</div><div class="somme" id="celebSomme">0 €</div></div>
      <div class="sep"></div>
      <div class="texte" id="celebTexte"></div>
    </div>
  </div>

  <!-- badge hexagonal Team Chat -->
  <svg class="badge" viewBox="0 0 232 232">
    <defs>
      <linearGradient id="gHex" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFE45C"/><stop offset=".55" stop-color="#FFD21F"/><stop offset="1" stop-color="#D99E00"/>
      </linearGradient>
      <linearGradient id="gVague" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFF08A" stop-opacity=".7"/><stop offset="1" stop-color="#FFF08A" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- contour jaune néon -->
    <polygon points="116,10 206,58 206,168 116,218 26,168 26,58" fill="none" stroke="#FFD21F" stroke-width="10" stroke-linejoin="round"/>
    <!-- anneau sombre -->
    <polygon points="116,22 196,64 196,162 116,206 36,162 36,64" fill="#1b1b18" stroke="#1b1b18" stroke-width="18" stroke-linejoin="round"/>
    <!-- cœur jaune -->
    <polygon points="116,44 176,76 176,152 116,186 56,152 56,76" fill="url(#gHex)" stroke="url(#gHex)" stroke-width="22" stroke-linejoin="round"/>
    <path d="M44 120 C 90 96, 140 150, 190 112 L 190 124 C 140 164, 90 110, 44 134 Z" fill="url(#gVague)" opacity=".55"/>
    <path d="M44 150 C 90 128, 140 176, 190 146 L 190 154 C 140 186, 90 140, 44 160 Z" fill="#fff4a0" opacity=".25"/>
    <!-- patte -->
    <g class="patte" fill="#FFF7DA" stroke="#171717" stroke-width="5" stroke-linejoin="round">
      <path d="M116 104 c 20 0 36 16 36 33 c 0 14 -10 20 -20 20 c -8 0 -10 -4 -16 -4 s -8 4 -16 4 c -10 0 -20 -6 -20 -20 c 0 -17 16 -33 36 -33 z"/>
      <ellipse cx="80" cy="96" rx="11" ry="14" transform="rotate(-20 80 96)"/>
      <ellipse cx="102" cy="76" rx="11" ry="15" transform="rotate(-6 102 76)"/>
      <ellipse cx="130" cy="76" rx="11" ry="15" transform="rotate(6 130 76)"/>
      <ellipse cx="152" cy="96" rx="11" ry="14" transform="rotate(20 152 96)"/>
    </g>
  </svg>

  <svg class="deco-piece" style="left:196px;top:-10px"><use href="#piece"/></svg>
  <svg class="deco-piece" style="left:8px;top:196px;width:20px;height:20px"><use href="#piece"/></svg>
</div>

<div class="pluie" id="pluie"></div>

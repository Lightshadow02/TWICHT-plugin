<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal de bord — récap</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --jaune: #F5C518; --jaune-fonce: #C9980A; --encre: #3b2412; --parchemin: #e8d5a8; --mer: #0b1d2e; --mer2: #123650; --rouge: #b3261e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Nunito', sans-serif; color: var(--encre); }
  body { background: radial-gradient(ellipse at 30% 40%, var(--mer2), var(--mer) 70%); }
  .feuille {
    position: absolute; left: 160px; top: 50px; width: 1600px; height: 980px; padding: 40px 60px;
    background: radial-gradient(ellipse at 20% 20%, rgba(255,255,255,.25), transparent 50%), radial-gradient(ellipse at 80% 90%, rgba(120,80,20,.25), transparent 50%), var(--parchemin);
    border-radius: 14px; box-shadow: inset 0 0 80px rgba(90,50,10,.45), 0 20px 60px rgba(0,0,0,.6);
    display: grid; grid-template-rows: auto auto 1fr auto; gap: 22px;
  }
  .feuille::before { content: ''; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; box-shadow: inset 0 0 0 6px rgba(70,35,5,.35), inset 0 0 40px 12px rgba(70,35,5,.35); }
  h1 { font-family: 'Pirata One'; font-size: 64px; line-height: 1; }
  h1 span { color: var(--jaune-fonce); }
  .sous { font-size: 20px; font-weight: 800; opacity: .75; margin-top: 6px; }
  .chiffres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .chiffre { background: rgba(59,36,18,.08); border-radius: 12px; padding: 16px; text-align: center; }
  .chiffre b { display: block; font-family: 'Pirata One'; font-size: 52px; line-height: 1; color: var(--encre); }
  .chiffre.or b { color: var(--jaune-fonce); }
  .chiffre span { font-size: 15px; font-weight: 800; opacity: .75; }
  .chiffre small { display: block; font-size: 13px; opacity: .6; margin-top: 4px; }
  .cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; min-height: 0; }
  h2 { font-family: 'Pirata One'; font-size: 32px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  h2 .tag { margin-left: auto; font-family: 'Nunito'; font-size: 14px; background: var(--encre); color: var(--jaune); border-radius: 20px; padding: 3px 12px; }
  ul { list-style: none; }
  .gages li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed rgba(59,36,18,.25); font-size: 18px; font-weight: 600; line-height: 1.3; }
  .gages li .c { font-family: 'Pirata One'; font-size: 22px; color: var(--rouge); min-width: 44px; }
  .gages li.duo .c { color: #b8600a; }
  .gages li.piege .c { color: #000; }
  .vide { opacity: .6; font-style: italic; font-weight: 600; padding: 8px 0; }
  .tresor { background: gold; border-radius: 12px; padding: 14px 18px; font-weight: 800; font-size: 20px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 0 30px rgba(255,215,0,.5); }
  .tresor .ico { font-size: 40px; }
  .top li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; font-size: 19px; font-weight: 700; padding: 5px 0; }
  .top li .r { font-family: 'Pirata One'; font-size: 26px; color: var(--jaune-fonce); }
  .top li b { color: var(--jaune-fonce); }
  .second { margin-top: 14px; background: var(--encre); color: var(--jaune); border-radius: 10px; padding: 10px 14px; font-weight: 800; font-size: 17px; text-align: center; }
  .merci { font-size: 16px; font-weight: 700; opacity: .85; margin-top: 12px; }
  .pied { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; opacity: .7; border-top: 2px solid rgba(59,36,18,.25); padding-top: 12px; }
</style>
</head>
<body>
<div class="feuille">
  <div>
    <h1>⚓ Journal de bord — <span id="titre">carte n°1</span></h1>
    <div class="sous" id="sous"></div>
  </div>
  <div class="chiffres">
    <div class="chiffre or"><b id="dons">0 €</b><span>récoltés cette nuit</span><small id="nbDons"></small></div>
    <div class="chiffre"><b id="km">0 km</b><span>de plus à marcher</span><small id="kmTot"></small></div>
    <div class="chiffre"><b id="cases">0</b><span>cases creusées</span><small id="casesTot"></small></div>
    <div class="chiffre"><b id="nbGages">0</b><span>gages pour le capitaine</span><small id="dettesTot"></small></div>
  </div>
  <div class="cols">
    <div>
      <div class="tresor" id="tresor" style="display:none"><span class="ico">💎</span><span id="tresorTxt"></span></div>
      <h2>📜 Les dettes de la nuit <span class="tag" id="capTag"></span></h2>
      <ul class="gages" id="gages"></ul>
    </div>
    <div>
      <h2>🪙 Pirates de la nuit</h2>
      <ul class="top" id="topNuit"></ul>
      <h2 style="margin-top:18px">🏴‍☠️ Classement général</h2>
      <ul class="top" id="topGlobal"></ul>
      <div class="second" id="second" style="display:none"></div>
      <div class="merci" id="merci"></div>
    </div>
  </div>
  <div class="pied"><span id="recomp"></span><span id="totaux"></span></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const h = t => new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
async function load() {
  const q = new URLSearchParams(location.search).get('carte') || 'current';
  const r = await fetch('/api/recap?carte=' + q).then(x => x.json());
  $('titre').textContent = `carte n°${r.numero}`;
  $('sous').textContent = `${new Date(r.depuis).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })} · ${h(r.depuis)} → ${h(r.jusqu)}${r.archive ? '' : ' (en cours)'}`;
  $('dons').textContent = fmt(r.dons) + ' €'; $('nbDons').textContent = `${r.nbDons} don${r.nbDons > 1 ? 's' : ''}`;
  $('km').textContent = fmt(r.km) + ' km'; $('kmTot').textContent = `${fmt(r.totaux.km)} km au total`;
  $('cases').textContent = r.nbRev; $('casesTot').textContent = `sur ${r.total}`;
  $('nbGages').textContent = r.gages.length; $('dettesTot').textContent = `${r.dettesEnAttente} en attente au total`;
  if (r.tresor) { $('tresor').style.display = ''; $('tresorTxt').textContent = `Trésor trouvé en ${r.tresor.cell} par ${r.tresor.by} à ${h(r.tresor.at)} — ${r.tresor.label || ''}`; }
  $('capTag').textContent = r.capitaine.length ? `le capitaine a contre-attaqué ${r.capitaine.length}×` : ''; $('capTag').style.display = r.capitaine.length ? '' : 'none';
  $('gages').innerHTML = r.gages.slice(0, 9).map(g => `<li class="${g.duo ? 'duo' : ''}${g.piege ? ' piege' : ''}"><span class="c">${g.cell}</span><span>${g.duo ? '🤝 ' : ''}${g.piege ? '💀 ' : ''}${esc(g.text)} <small style="opacity:.6">— ${h(g.at)}</small></span></li>`).join('')
    + (r.gages.length > 9 ? `<li class="vide">… et ${r.gages.length - 9} de plus</li>` : '') || '<li class="vide">Le capitaine s’en sort sans gage cette nuit. Suspect.</li>';
  const med = ['🥇', '🥈', '🥉'];
  $('topNuit').innerHTML = r.topNuit.map((p, i) => `<li><span class="r">${med[i]}</span><span>${esc(p.nom)}</span><b>+${p.doublons} 🪙</b></li>`).join('') || '<li class="vide">Aucun doublon distribué cette nuit.</li>';
  $('topGlobal').innerHTML = r.topGlobal.map((p, i) => `<li><span class="r">${i + 1}</span><span>${esc(p.nom)}</span><b>${p.doublons} 🪙</b></li>`).join('') || '<li class="vide">—</li>';
  if (r.second) { $('second').style.display = ''; $('second').textContent = `⚓ Second du navire : ${r.second} — son vote compte double`; }
  $('merci').textContent = r.topDonateurs.length ? `💛 Merci à ${r.topDonateurs.map(d => `${d.nom} (${fmt(d.montant)} €)`).join(', ')}` : '';
  $('recomp').textContent = r.recompense; $('totaux').textContent = `Event : ${fmt(r.totaux.dons)} € · ${fmt(r.totaux.km)} km · ${r.totaux.nbDons} dons`;
}
load(); setInterval(load, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Écran Pirate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Couleurs animables : !couleur change l'ambiance en douceur */
@property --ciel0 { syntax:'<color>'; inherits:true; initial-value:#050918; }
@property --ciel1 { syntax:'<color>'; inherits:true; initial-value:#14254a; }
@property --ciel2 { syntax:'<color>'; inherits:true; initial-value:#2d4b78; }
@property --mer0  { syntax:'<color>'; inherits:true; initial-value:#1f5189; }
@property --mer1  { syntax:'<color>'; inherits:true; initial-value:#163f6e; }
@property --mer2  { syntax:'<color>'; inherits:true; initial-value:#0d2c51; }
@property --mer3  { syntax:'<color>'; inherits:true; initial-value:#081c36; }
@property --ecume { syntax:'<color>'; inherits:true; initial-value:#9fcdee; }
:root{
  --ciel0:#050918; --ciel1:#14254a; --ciel2:#2d4b78;
  --mer0:#1f5189; --mer1:#163f6e; --mer2:#0d2c51; --mer3:#081c36; --ecume:#9fcdee;
  --or:#f4c65a; --or-clair:#f6c955; --bois:#3a2211; --bois-fonce:#1e1007; --laiton:#c7973a;
  --parchemin:#f1ddae; --parchemin2:#efdcaf; --encre:#2c180a; --encre-rouge:#8e2a12; --sable-txt:#e8cf94;
  transition: --ciel0 2.5s, --ciel1 2.5s, --ciel2 2.5s, --mer0 2.5s, --mer1 2.5s, --mer2 2.5s, --mer3 2.5s, --ecume 2.5s;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#fff6e0;-webkit-font-smoothing:antialiased}

/* La scène fait toujours 1920×1080 et s'adapte à l'écran */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:50% 50%;
  background:linear-gradient(180deg,var(--ciel0) 0%,var(--ciel1) 42%,var(--ciel2) 60%)}
.abs{position:absolute}
svg{display:block}

/* ---------- décor ---------- */
.etoile{position:absolute;border-radius:50%;background:#fff8e6;animation:scint var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes scint{50%{opacity:.12}}
.nuage{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(190,205,240,.10),rgba(190,205,240,0) 70%);animation:derive var(--t) ease-in-out infinite alternate}
@keyframes derive{to{transform:translateX(var(--dx))}}
#halo{left:215px;top:65px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,180,.24),rgba(255,236,180,0) 68%)}
#lune{left:300px;top:150px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffbea 0%,#ebdfb1 58%,#c9b986 100%)}
.cratere{position:absolute;border-radius:50%;background:rgba(150,130,80,.2)}
.vague path.fond{transition:fill 2.5s}
.reflet{position:absolute;height:4px;border-radius:2px;background:#ffeec2;animation:miroite var(--d) ease-in-out infinite alternate}
@keyframes miroite{to{opacity:.08;transform:scaleX(.7)}}
#bateau-route{left:0;top:560px;width:150px;animation:navigue 260s linear infinite}
#bateau{animation:tangue 5s ease-in-out infinite;transform-origin:50% 85%}
@keyframes navigue{from{transform:translateX(-220px)}to{transform:translateX(2100px)}}
@keyframes tangue{50%{transform:rotate(-3deg) translateY(3px)}}
#rayons{left:510px;top:180px;width:900px;height:560px;opacity:.45;transition:opacity 1.2s;
  background:repeating-conic-gradient(from -70deg at 50% 100%,rgba(255,214,120,.12) 0deg 5deg,rgba(255,214,120,0) 5deg 14deg);
  -webkit-mask-image:linear-gradient(0deg,#000 5%,transparent 85%);mask-image:linear-gradient(0deg,#000 5%,transparent 85%)}
#lueur{left:580px;top:500px;width:760px;height:520px;border-radius:50%;opacity:.6;transition:opacity 1.2s;
  background:radial-gradient(ellipse,rgba(255,200,90,.5) 0%,rgba(255,200,90,0) 65%)}
#stage.fete #rayons{opacity:1} #stage.fete #lueur{opacity:1}
#palmier{left:560px;top:535px;transform-origin:58% 100%;animation:vent 7s ease-in-out infinite}
@keyframes vent{50%{transform:rotate(1.6deg)}}
#tissu{transform-origin:25px 75px;animation:flotte 3.2s ease-in-out infinite}
@keyframes flotte{50%{transform:skewY(-3deg) scaleX(.96)}}
#coffre{left:740px;top:560px;overflow:visible}
#stage.fete #coffre{animation:saute .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes saute{30%{transform:translateY(-28px) scale(1.05)}}
#or{transition:transform 1.8s cubic-bezier(.3,1.4,.5,1)}
.eclat{transform-box:fill-box;transform-origin:center;animation:eclat 3.2s ease-in-out infinite}
@keyframes eclat{0%,70%,100%{opacity:0;transform:scale(.3)}82%{opacity:1;transform:scale(1)}}

/* ---------- interface (HUD) ---------- */
#titre{left:72px;top:36px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#t-titre{font-family:'Pirata One',serif;font-weight:400;font-size:168px;line-height:1;color:var(--or);
  text-shadow:0 7px 0 #3d2210,0 0 48px rgba(244,198,90,.35)}
#t-sous{margin-left:8px;padding:8px 48px 10px;background:var(--parchemin2);color:#3b2410;font-family:'IM Fell English SC',serif;font-size:32px;
  clip-path:polygon(0 0,100% 0,calc(100% - 20px) 50%,100% 100%,0 100%,20px 50%)}
.corde{position:absolute;top:0;width:6px;border-radius:3px;background:repeating-linear-gradient(180deg,#c29a5a 0 7px,#7a5528 7px 14px)}
.plaque{position:absolute;left:0;background:var(--bois);border:6px solid var(--laiton);border-radius:20px;
  box-shadow:0 22px 44px rgba(0,0,0,.5),inset 0 0 0 3px var(--bois-fonce),inset 0 0 40px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center}
.rivet{position:absolute;width:12px;height:12px;border-radius:50%;background:#e4b95a;box-shadow:0 2px 0 var(--bois-fonce)}
.etiquette{font-family:'IM Fell English SC',serif;font-size:30px;letter-spacing:.06em;color:var(--sable-txt);display:flex;align-items:center;gap:10px;white-space:nowrap}
#tresor{left:700px;top:0;width:520px;height:320px}
#tresor .plaque{top:46px;width:520px;padding:20px 32px 24px;gap:2px}
#t-montant{width:100%;text-align:center;font-family:'Pirata One',serif;font-size:124px;line-height:1;color:var(--or-clair);text-shadow:0 5px 0 var(--bois-fonce);white-space:nowrap;overflow:hidden}
#t-objectif{font-size:24px;font-weight:600;color:var(--sable-txt);opacity:.8}
#chrono{right:72px;top:0;width:440px;height:300px}
#chrono .plaque{top:58px;width:440px;padding:20px 28px 22px;gap:4px}
#c-valeur{font-size:88px;font-weight:800;line-height:1.05;color:#fff6e0;font-variant-numeric:tabular-nums;letter-spacing:.01em;text-shadow:0 5px 0 var(--bois-fonce)}
#c-unites{font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--sable-txt);opacity:.65}
.carte{position:absolute;background:var(--parchemin2);color:#3b2410;border-radius:12px;
  box-shadow:0 18px 36px rgba(0,0,0,.45),inset 0 0 36px rgba(150,95,35,.4);display:flex;align-items:center;gap:18px;padding:18px 26px}
.carte .etiq{font-family:'IM Fell English SC',serif;font-size:24px;color:var(--encre-rouge)}
.carte .nom{font-size:28px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#butin{right:72px;top:780px;width:480px;transform:rotate(1.5deg);transition:opacity .8s,transform .8s}
#butin.cache{opacity:0;transform:rotate(1.5deg) translateY(30px)}
#butin-montant{font-family:'Pirata One',serif;font-size:52px;line-height:1;color:#9a6a10;white-space:nowrap}
#toast{left:72px;top:780px;width:440px;transform:rotate(-1.5deg) translateX(-620px);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
#toast.on{transform:rotate(-1.5deg)}
#bandeau{left:370px;top:958px;width:1180px;height:88px;border:4px solid var(--encre);border-radius:14px;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,rgba(0,0,0,0) 2px 10px),#5b3418;
  box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,220,160,.18)}
.clou{position:absolute;top:32px;width:14px;height:14px;border-radius:50%;background:var(--encre);box-shadow:inset 0 2px 0 #8a6a40}
#b-contenu{position:absolute;inset:0 44px;display:flex;align-items:center;justify-content:center;gap:18px;transition:opacity .6s;white-space:nowrap}
#b-contenu.cache{opacity:0}
.b-txt{font-size:36px;font-weight:700;color:#f3e4bd}
.b-cmd{font-size:34px;font-weight:800;color:var(--encre);background:var(--or);padding:4px 16px;border-radius:8px}

/* ---------- message !ecran (parchemin roulé) ---------- */
#bulle{left:510px;top:330px;width:900px;display:flex;flex-direction:column;align-items:center;
  transform-origin:50% 0;transform:rotate(-1deg) scaleY(.08);opacity:0;transition:transform .8s cubic-bezier(.3,1.25,.5,1),opacity .4s}
#bulle.on{transform:rotate(-1deg) scaleY(1);opacity:1}
.rouleau{width:900px;height:44px;border-radius:22px;background:linear-gradient(180deg,#b07a42 0%,#6b4221 60%,#3e2410 100%);box-shadow:0 10px 20px rgba(0,0,0,.4)}
#b-papier{position:relative;width:820px;padding:34px 64px 48px;background:var(--parchemin);color:var(--encre);text-align:center;
  box-shadow:inset 0 0 50px rgba(150,95,35,.45),0 20px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:12px}
#b-nom{font-family:'IM Fell English SC',serif;font-size:36px;color:var(--encre-rouge);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#b-texte{font-size:58px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.sceau{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 32%,#c43a26 0%,#9c2414 55%,#6e140a 100%);box-shadow:0 10px 22px rgba(0,0,0,.45)}
#b-sceau{right:-40px;bottom:-44px;width:116px;height:116px;transform:rotate(-8deg)}

/* ---------- alerte ---------- */
#alerte{inset:0;opacity:0;transition:opacity .5s;pointer-events:none}
#alerte.on{opacity:1}
#a-voile{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(4,6,16,.3) 0%,rgba(4,6,16,.82) 78%)}
#a-rayons{left:360px;top:-140px;width:1200px;height:1200px;animation:tourne 50s linear infinite;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,214,120,.16) 0deg 4deg,rgba(255,214,120,0) 4deg 12deg);
  -webkit-mask-image:radial-gradient(circle,#000 12%,transparent 58%);mask-image:radial-gradient(circle,#000 12%,transparent 58%)}
@keyframes tourne{to{transform:rotate(360deg)}}
#a-carte{left:470px;top:190px;width:980px;padding:48px 72px 60px;background:var(--parchemin);color:var(--encre);border-radius:10px;
  box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 70px rgba(150,95,35,.5);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  transform:translateY(-80px) rotate(-7deg) scale(.7);transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
#alerte.on #a-carte{transform:rotate(-1.5deg)}
#a-type{font-family:'IM Fell English SC',serif;font-size:42px;letter-spacing:.08em;color:var(--encre-rouge)}
.filet{display:flex;align-items:center;gap:16px;width:100%}
.filet i{flex-grow:1;height:2px;background:var(--encre-rouge);opacity:.45}
#a-nom{width:100%;font-family:'Pirata One',serif;font-size:160px;line-height:1.02;text-shadow:0 4px 0 rgba(150,95,35,.35);white-space:nowrap;overflow:hidden}
#a-msg{font-family:'IM Fell English',serif;font-style:italic;font-size:42px;color:#4a2e16;overflow-wrap:anywhere}
#a-msg:empty{display:none}
#a-sceau{right:-70px;bottom:-90px;width:240px;height:240px;transform:rotate(9deg)}
#a-sceau::before{content:'';position:absolute;left:16px;top:16px;width:208px;height:208px;border-radius:50%;border:3px dashed rgba(255,220,200,.4)}
#a-sceau-val{font-family:'Pirata One',serif;font-size:96px;line-height:.95;color:#fbe9d6;white-space:nowrap}
#a-sceau-sous{font-family:'IM Fell English SC',serif;font-size:26px;color:#f6d4c2}

/* ---------- effets ---------- */
#emotes,#effets{position:absolute;inset:0;pointer-events:none}
.emote{position:absolute;top:0;object-fit:contain;will-change:transform}
.piece{position:absolute;margin:-30px 0 0 -30px;width:60px;height:60px;border-radius:50%;will-change:transform;
  background:radial-gradient(circle at 35% 30%,#fff4b8 0%,#f5c84c 45%,#b8841a 100%);box-shadow:inset 0 0 0 5px rgba(140,90,10,.55),0 6px 14px rgba(0,0,0,.35)}
body.panique #bulle,body.panique #emotes{display:none}
</style>
</head>

      </g>
      <path d="M200 90 l10 -12 l10 12 l-10 12 Z" fill="#d6405a" stroke="#7a1426" stroke-width="2"/>

/* Liste de base du filtre (normalisée : sans accents, leet → lettres, lettres doublées fusionnées).
   'mot'  = mot exact ; 'mot*' = tout mot qui commence par ça ; 'deux mots' = expression.        */

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const rnd = (a, b) => a + Math.random() * (b - a);
const euros = n => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }).format(n);
const stock = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
};
// réduit la police jusqu'à ce que le texte tienne dans sa boîte
function ajusterTaille(el, max, min){
  let s = max; el.style.fontSize = s + 'px';
  while (el.scrollWidth > el.clientWidth + 1 && s > min){ s -= 4; el.style.fontSize = s + 'px'; }
}
function ajusterEcran(){
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${k})`;
}
addEventListener('resize', ajusterEcran);

/* ---------- décor ---------- */
function construireDecor(){
  const et = $('#etoiles');
  for (let i = 0; i < 80; i++){
    const x = rnd(0, 1920), y = rnd(0, 600), t = rnd(1, 3.6);
    if (x > 230 && x < 540 && y > 90 && y < 390) continue;           // pas d'étoiles sur la lune
    const s = document.createElement('div'); s.className = 'etoile';
    Object.assign(s.style, { left: x + 'px', top: y + 'px', width: t + 'px', height: t + 'px', opacity: rnd(.3, 1) });
    s.style.setProperty('--d', rnd(2, 6) + 's'); s.style.setProperty('--dl', rnd(0, 5) + 's');
    et.appendChild(s);
  }
  const rf = $('#reflets');
  for (let i = 0; i < 9; i++){
    const w = rnd(40, 150), d = document.createElement('div'); d.className = 'reflet';
    Object.assign(d.style, { left: (385 - w / 2 + rnd(-15, 15)) + 'px', top: (664 + i * 24) + 'px', width: w + 'px', opacity: (.55 - i * .05) });
    d.style.setProperty('--d', rnd(1.5, 3.5) + 's');
    rf.appendChild(d);
  }
  // vagues : un motif périodique qu'on fait glisser d'une période, en boucle
  document.querySelectorAll('svg.vague').forEach(v => {
    const D = v.dataset, per = +D.per, base = +D.base, amp = +D.amp, H = +D.h, W = 1920 + per * 2;
    let d = `M0 ${base}`;
    for (let x = 0; x < W; x += per) d += ` Q${x + per / 2} ${base - amp} ${x + per} ${base}`;
    v.setAttribute('width', W); v.setAttribute('height', H); v.setAttribute('viewBox', `0 0 ${W} ${H}`);
    v.style.left = (-per) + 'px'; v.style.top = D.top + 'px';
    v.innerHTML = `<path class="fond" d="${d} V${H} H0 Z" style="fill:var(${D.fond})"/>` +
      (D.ecume ? `<path d="${d}" fill="none" style="stroke:var(--ecume)" stroke-width="3" stroke-opacity="${D.ecume}"/>` : '');
    const sens = D.inverse ? -1 : 1;
    v.animate([{ transform:'translateX(0)' }, { transform:`translateX(${sens * per}px)` }], { duration: +D.duree, iterations: Infinity });
  });
}
function appliquerPalette(nom){
  const p = PALETTES[nom]; if (!p) return false;
  const r = document.documentElement.style;
  p[0].forEach((c, i) => r.setProperty('--ciel' + i, c));
  p[1].forEach((c, i) => r.setProperty('--mer' + i, c));
  r.setProperty('--ecume', p[2]);
  return true;
}

/* ---------- trésor & dernier butin ---------- */
let total = CONFIG.total ?? parseFloat(stock.get('ecranPirate.total') || 0);
function majTresor(){
  stock.set('ecranPirate.total', total);
  const el = $('#t-montant'); el.textContent = euros(total); ajusterTaille(el, 124, 60);
  // échelle log + un fond d'or : le coffre bouge même loin d'un gros objectif
  const r = Math.max(0, Math.min(1, Math.log10(1 + total) / Math.log10(1 + CONFIG.objectif)));
  $('#or').style.transform = `translateY(${Math.round((1 - (.3 + .7 * r)) * 120)}px)`;
}
function majButin(b){
  if (!b) return;
  stock.set('ecranPirate.butin', JSON.stringify(b));
  $('#butin-nom').textContent = b.nom;
  $('#butin-montant').textContent = euros(b.montant);
  $('#butin').classList.remove('cache');
}

/* ---------- chrono ---------- */
function majChrono(){
  const pad = n => String(n).padStart(2, '0');
  const hms = ms => { const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
  const now = new Date(), U = $('#c-unites');
  if (!CONFIG.debut){
    $('#c-label').textContent = 'Heure à bord';
    $('#c-valeur').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    U.style.visibility = 'hidden';
    return;
  }
  U.style.visibility = 'visible';
  const debut = new Date(CONFIG.debut), fin = debut.getTime() + CONFIG.dureeH * 3600e3;
  if (now < debut){ $('#c-label').textContent = 'Départ dans'; $('#c-valeur').textContent = hms(debut - now); }
  else if (now < fin){ $('#c-label').textContent = `Fin du ${CONFIG.dureeH}h dans`; $('#c-valeur').textContent = hms(fin - now); }
  else { $('#c-label').textContent = `${CONFIG.dureeH}h terminé`; $('#c-valeur').textContent = 'Terre !'; U.style.visibility = 'hidden'; }
}

/* ---------- bandeau ---------- */
let iMsg = 0;
function bandeauSuivant(){
  const c = $('#b-contenu');
  c.classList.add('cache');
  setTimeout(() => {
    const m = CONFIG.messages[iMsg++ % CONFIG.messages.length];
    c.innerHTML = '';
    c.insertAdjacentHTML('beforeend', ICONES[m.icone] || '');
    const bout = (cls, txt) => { if (!txt) return; const s = document.createElement('div'); s.className = cls; s.textContent = txt; c.appendChild(s); };
    bout('b-txt', m.avant); bout('b-cmd', m.cmd); bout('b-txt', m.apres);
    c.classList.remove('cache');
  }, 600);
}

/* ---------- pluie d'emotes ---------- */
let nbEmotes = 0;
function pluieEmote(id){
  if (nbEmotes >= CONFIG.maxEmotes || moderation.panique) return;
  nbEmotes++;
  const img = new Image(); img.className = 'emote';
  img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/default/dark/3.0`;
  const t = rnd(72, 128);
  img.style.width = img.style.height = t + 'px';
  img.style.left = rnd(30, 1820) + 'px';
  $('#emotes').appendChild(img);
  const fin = rnd(700, 990), sway = rnd(-110, 110);
  const anim = img.animate([
    { transform:`translate(0, -140px) rotate(${-sway / 6}deg)`, opacity:0 },
    { opacity:1, offset:.08 },
    { transform:`translate(${sway}px, ${fin * .9}px) rotate(${sway / 6}deg)`, opacity:1, offset:.85 },
    { transform:`translate(${sway * 1.1}px, ${fin}px) scale(.3)`, opacity:0 },
  ], { duration: rnd(4500, 7500) });
  const nettoie = () => { img.remove(); nbEmotes--; };
  anim.onfinish = nettoie;
  img.onerror = () => { anim.onfinish = null; anim.cancel(); nettoie(); };
}

/* ---------- explosion de pièces (depuis le coffre) ---------- */
function explosionPieces(n){
  const x0 = 960, y0 = 690;
  for (let i = 0; i < n; i++){
    const c = document.createElement('div'); c.className = 'piece';
    const k = rnd(.55, 1.25);
    c.style.left = x0 + 'px'; c.style.top = y0 + 'px';
    $('#effets').appendChild(c);
    const dx = rnd(-880, 880), haut = rnd(300, 680);
    c.animate([
      { transform:`translate(0,0) scale(${k * .4})`, easing:'cubic-bezier(.2,.8,.4,1)' },
      { transform:`translate(${dx * .55}px, ${-haut}px) scale(${k}) rotateY(${rnd(180, 720)}deg)`, offset:.45, easing:'cubic-bezier(.5,0,.8,.4)' },
      { transform:`translate(${dx}px, ${rnd(60, 340)}px) scale(${k * .9}) rotateY(${rnd(720, 1440)}deg)`, opacity:0 },
    ], { duration: rnd(1800, 2800), delay: rnd(0, 600), fill:'both' }).onfinish = () => c.remove();
  }
}

/* ---------- grosses alertes (dons, subs, bits) ---------- */
const fileAlertes = []; let alerteEnCours = false;
function alerte(a){
  a.nom = nomSur(a.nom);
  a.message = a.message ? (verifierTexte(a.message, 140) || '') : '';
  fileAlertes.push(a);
  if (!alerteEnCours) alerteSuivante();
}
function alerteSuivante(){
  const a = fileAlertes.shift();
  if (!a){ alerteEnCours = false; return; }
  alerteEnCours = true;
  const T = {
    don:  ['Un don tombe dans le coffre', euros(a.montant || 0), 'de butin'],
    sub:  ['Un nouveau matelot à bord', a.mois > 1 ? `${a.mois} mois` : 'Bienvenue', a.mois > 1 ? 'à bord' : 'matelot'],
    bits: ['Des bits pour le trésor', String(a.montant || ''), 'bits'],
  }[a.type] || ['', '', ''];
  $('#a-type').textContent = T[0];
  $('#a-sceau-val').textContent = T[1];
  $('#a-sceau-sous').textContent = T[2];
  $('#a-sceau-val').style.fontSize = T[1].length > 6 ? '62px' : T[1].length > 4 ? '78px' : '96px';
  $('#a-msg').textContent = (CONFIG.afficherMsgDons && a.message && !moderation.panique) ? `« ${a.message} »` : '';
  const nom = $('#a-nom'); nom.textContent = a.nom;
  $('#alerte').classList.add('on');
  ajusterTaille(nom, 160, 64);
  if (a.type === 'don' && !a.test){
    total += a.montant || 0;
    setTimeout(majTresor, 700);
    majButin({ nom: a.nom, montant: a.montant || 0 });
  }
  explosionPieces(a.type === 'don' ? Math.min(90, 25 + Math.round((a.montant || 0) * 2)) : 30);
  stage.classList.remove('fete'); void stage.offsetWidth; stage.classList.add('fete');
  setTimeout(() => {
    $('#alerte').classList.remove('on');
    setTimeout(() => { stage.classList.remove('fete'); alerteSuivante(); }, 900);
  }, 7000);
}

let toastTimer;
function toast(nom){
  $('#toast-nom').textContent = nom;
  const t = $('#toast'); t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 5000);
}

/* ---------- filtre anti-abus ---------- */
const LEET = { '0':'o', '1':'i', '3':'e', '4':'a', '5':'s', '7':'t', '8':'b', '@':'a', '$':'s', '€':'e', '|':'i' };
const replie = t => t.replace(/(.)\1+/g, '$1');                        // « connnnard » → « conard »
const normaliser = t => replie(t.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/[0134578@$€|]/g, c => LEET[c]));
const LISTE = (() => {
  const exacts = new Set(), prefixes = [], phrases = [];
  for (const brut of [...BASE_INTERDITS, ...CONFIG.motsInterdits]){
    const etoile = brut.trim().endsWith('*');
    const m = normaliser(brut.trim().replace(/\*$/, ''));
    if (!m) continue;
    if (m.includes(' ')) phrases.push(m); else if (etoile) prefixes.push(m); else exacts.add(m);
  }
  return { exacts, prefixes, phrases, colles: BASE_COLLES.map(normaliser) };
})();
function contientInterdit(t){
  const tokens = normaliser(t).split(/[^a-z]+/).filter(Boolean);
  const fusion = []; let run = '';                                     // « p u t e » → « pute »
  for (const k of tokens){ if (k.length === 1) run += k; else { if (run) fusion.push(replie(run)); run = ''; fusion.push(k); } }
  if (run) fusion.push(replie(run));
  const mauvais = k => LISTE.exacts.has(k) || LISTE.prefixes.some(p => k.startsWith(p));
  if (tokens.some(mauvais) || fusion.some(mauvais)) return true;
  const phrase = ' ' + tokens.join(' ') + ' ';
  if (LISTE.phrases.some(p => phrase.includes(' ' + p + ' '))) return true;
  const colle = replie(tokens.join(''));
  return LISTE.colles.some(m => colle.includes(m));
}
// Renvoie le texte nettoyé, ou null s'il doit être refusé
function verifierTexte(brut, max){
  let t = String(brut || '').normalize('NFC')
    .replace(/[​-‏‪-‮⁠-⁤﻿]/g, '')   // caractères invisibles
    .replace(/\p{M}/gu, '')                                            // texte « zalgo » (les accents français restent, ils sont précomposés)
    .replace(/\s+/g, ' ').trim();
  if (t.length < 2) return null;
  if (/[─-◿⠀-⣿]/.test(t)) return null;              // dessins en ASCII / braille
  if (/(https?:|www\.|\b[\w-]+\s*(\.|\(dot\)|\[dot\]|\sdot\s|\spoint\s)\s*(com|fr|net|org|gg|tv|io|ly|be|xyz|me|co)\b)/i.test(t)) return null;
  if (/@\w/.test(t)) return null;                                       // @mentions et mails
  if (/\d[\d .\-]{6,}\d/.test(t)) return null;                          // numéros de téléphone, etc.
  if ((t.match(/\p{Extended_Pictographic}/gu) || []).length > 5) return null;
  if (contientInterdit(t)) return null;
  t = t.replace(/(.)\1{3,}/gu, '$1$1$1');                               // « aaaaaaah » → « aaah »
  const lettres = t.replace(/[^\p{L}]/gu, '');
  if (lettres.length > 8 && lettres.replace(/[^\p{Lu}]/gu, '').length / lettres.length > 0.7)
    t = t.charAt(0) + t.slice(1).toLowerCase();                          // PLUS DE CRIS
  return max ? t.slice(0, max) : t;
}
const nomSur = n => (n && verifierTexte(n, 25)) || 'Un matelot';

/* ---------- modération ---------- */
const moderation = {
  actif: CONFIG.ecranAcces !== 'off',
  validation: CONFIG.ecranValidation,
  panique: false,
  bannis: new Set((() => { try { return JSON.parse(stock.get('ecranPirate.bannis') || '[]'); } catch(e){ return []; } })()),
  avertis: {},      // nb de messages refusés par personne
  punis: new Map(), // pseudo → fin du blocage auto
  compteur: {},     // messages envoyés pendant la session
  attente: [],      // messages en attente de !ok
};
const sauverBannis = () => stock.set('ecranPirate.bannis', JSON.stringify([...moderation.bannis]));
setInterval(() => { const lim = Date.now() - 120e3; moderation.attente = moderation.attente.filter(m => m.recu > lim); }, 15e3);

/* ---------- !ecran ---------- */
const fileEcran = []; let ecranCourant = null;
const dernierEcran = {}; const supprimes = new Set(); const bannis = new Map();
function autorise(u){
  if (u.mod) return true;
  switch (CONFIG.ecranAcces){
    case 'off': case 'mods': return false;
    case 'vip':  return u.vip;
    case 'subs': return u.sub || u.vip;
    default:     return true;
  }
}
function commandeEcran(u){
  if (!autorise(u)) return;
  const now = Date.now();
  if (!u.mod){
    if (!moderation.actif || moderation.bannis.has(u.user)) return;
    if ((moderation.punis.get(u.user) || 0) > now) return;
    if (u.premierMsg) return;                                                     // tout premier message sur la chaîne
    if (!u.vip && (moderation.compteur[u.user] || 0) - 1 < CONFIG.ecranMessagesMin) return;
  }
  const texte = verifierTexte(u.texte, CONFIG.ecranMaxCaracteres);
  if (!texte || verifierTexte(u.nom, 25) === null){
    const n = (moderation.avertis[u.user] = (moderation.avertis[u.user] || 0) + 1);
    if (n >= 2) moderation.punis.set(u.user, now + 30 * 60e3);                    // 2 refus → bloqué 30 min
    return;
  }
  if (!u.mod && now - (dernierEcran[u.user] || 0) < CONFIG.ecranCooldownUser * 1000) return;
  if (fileEcran.length + moderation.attente.length >= 6) return;
  dernierEcran[u.user] = now;
  const m = { ...u, texte, recu: now };
  if (moderation.validation && !u.mod){ moderation.attente.push(m); return; }
  setTimeout(() => publierEcran(m), CONFIG.ecranDelai * 1000);
}
function publierEcran(m){
  if (supprimes.has(m.id) || (bannis.get(m.user) || 0) >= m.recu - 60e3 || moderation.bannis.has(m.user)) return;
  if (!m.mod && (!moderation.actif || moderation.panique)) return;
  fileEcran.push(m);
  if (!ecranCourant) ecranSuivant();
}
let ecranTimer;
function ecranSuivant(){
  const e = fileEcran.shift();
  ecranCourant = e || null;
  if (!e) return;
  $('#b-nom').textContent = `${e.nom} a écrit`;
  const t = $('#b-texte'); t.textContent = e.texte;
  t.style.fontSize = e.texte.length < 40 ? '58px' : e.texte.length < 62 ? '50px' : '44px';
  $('#bulle').classList.add('on');
  ecranTimer = setTimeout(fermerEcran, CONFIG.ecranDuree * 1000);
}
function fermerEcran(){
  clearTimeout(ecranTimer);
  $('#bulle').classList.remove('on');
  setTimeout(ecranSuivant, 700);
}
function retirer(test){
  for (let i = fileEcran.length - 1; i >= 0; i--) if (test(fileEcran[i])) fileEcran.splice(i, 1);
  moderation.attente = moderation.attente.filter(e => !test(e));
  if (ecranCourant && test(ecranCourant)){ ecranCourant = {}; fermerEcran(); }
}
function viderEcran(){
  fileEcran.length = 0; moderation.attente.length = 0;
  if (ecranCourant){ ecranCourant = {}; fermerEcran(); }
}

/* ---------- !couleur ---------- */
let derniereCouleur = 0;
function commandeCouleur(nom, mod){
  nom = (nom || '').toLowerCase().trim();
  if (!PALETTES[nom] || (!mod && Date.now() - derniereCouleur < CONFIG.couleurCooldown * 1000)) return;
  derniereCouleur = Date.now();
  appliquerPalette(nom);
}

/* ---------- chat Twitch (lecture anonyme) ---------- */
const histoEmotes = {};
function peutEmote(user){
  const now = Date.now();
  const h = (histoEmotes[user] || []).filter(t => now - t < 10e3);
  histoEmotes[user] = h;
  if (h.length >= CONFIG.emotesParUserMax) return false;
  h.push(now); return true;
}
function surMessage(tags, msg){
  const user = tags.username;
  moderation.compteur[user] = (moderation.compteur[user] || 0) + 1;
  const b = tags.badges || {};
  const u = {
    id: tags.id, user, nom: tags['display-name'] || user, texte: '',
    mod: !!(tags.mod || b.broadcaster), vip: !!b.vip, sub: !!(tags.subscriber || b.founder),
    premierMsg: !!tags['first-msg'],
  };
  if (tags.emotes && !moderation.panique && !u.premierMsg && !moderation.bannis.has(user)){
    let k = 0;
    for (const [id, pos] of Object.entries(tags.emotes))
      for (let j = 0; j < pos.length && k < CONFIG.emotesParMessage; j++, k++)
        if (peutEmote(user)) setTimeout(() => pluieEmote(id), k * 160);
  }
  if (!msg.startsWith('!')) return;
  const [cmd, ...rest] = msg.trim().split(/\s+/);
  u.texte = rest.join(' ');
  const c = cmd.toLowerCase();
  if (c === '!ecran')   return commandeEcran(u);
  if (c === '!couleur') return commandeCouleur(rest[0], u.mod);
  if (!u.mod) return;

  // --- commandes réservées aux modos ---
  const nombre = s => parseFloat(String(s || '').replace(',', '.'));
  const cible = s => String(s || '').replace(/^@/, '').toLowerCase();
  switch (c){
    case '!don': {        // !don Pseudo 10 [message] → dons hors Streamlabs
      const v = nombre(rest[1]);
      if (rest[0] && v > 0) alerte({ type:'don', nom:rest[0], montant:v, message:rest.slice(2).join(' ') });
      break;
    }
    case '!tresor': { const v = nombre(rest[0]); if (v >= 0){ total = v; majTresor(); } break; }
    case '!testalerte': alerte({ type:'don', nom:u.nom, montant:5, message:'Test du coffre', test:true }); break;
    case '!ok':  { const m = moderation.attente.shift(); if (m) publierEcran(m); break; }
    case '!non': moderation.attente.shift(); break;
    case '!skip': if (ecranCourant) fermerEcran(); break;
    case '!clear': viderEcran(); break;
    case '!ecranoff': moderation.actif = false; viderEcran(); break;
    case '!ecranon':  moderation.actif = true; break;
    case '!validation': moderation.validation = rest[0] !== 'off'; break;
    case '!ecranban': {
      const p = cible(rest[0]);
      if (p){ moderation.bannis.add(p); sauverBannis(); retirer(e => e.user === p); }
      break;
    }
    case '!ecranunban': {
      const p = cible(rest[0]);
      if (p){ moderation.bannis.delete(p); moderation.punis.delete(p); moderation.avertis[p] = 0; sauverBannis(); }
      break;
    }
    case '!panique':      // coupe tout ce qui vient du chat d'un coup
      moderation.panique = true; moderation.actif = false; viderEcran(); document.body.classList.add('panique');
      break;
    case '!calme':
      moderation.panique = false; moderation.actif = CONFIG.ecranAcces !== 'off'; document.body.classList.remove('panique');
      break;
  }
}
function initChat(){
  if (typeof tmi === 'undefined') return console.warn('tmi.js non chargé');
  const c = new tmi.Client({ channels:[CONFIG.chaine], connection:{ secure:true, reconnect:true } });
  c.on('message', (ch, tags, msg) => surMessage(tags, msg));
  c.on('messagedeleted', (ch, user, txt, tags) => { const id = tags['target-msg-id']; supprimes.add(id); retirer(e => e.id === id); });
  const vire = (ch, user) => { bannis.set(user, Date.now()); retirer(e => e.user === user); };
  c.on('timeout', vire); c.on('ban', vire);
  c.connect().catch(console.error);
}

/* ---------- Streamlabs (dons, subs, bits, follows) ---------- */
function initStreamlabs(){
  if (!CONFIG.streamlabsToken) return;
  if (typeof io === 'undefined') return console.warn('socket.io non chargé');
  const s = io(`https://sockets.streamlabs.com?token=${encodeURIComponent(CONFIG.streamlabsToken)}`, { transports:['websocket'] });
  s.on('event', e => {
    for (const m of (Array.isArray(e.message) ? e.message : [])){
      if (e.type === 'donation') alerte({ type:'don', nom:m.name, montant:parseFloat(m.amount) || 0, message:m.message });
      else if (e.type === 'subscription' || e.type === 'resub') alerte({ type:'sub', nom:m.name, mois:+m.months || 1 });
      else if (e.type === 'bits') alerte({ type:'bits', nom:m.name, montant:m.amount, message:m.message });
      else if (e.type === 'follow') toast(nomSur(m.name));
    }
  });
}

/* ---------- mode démo (?demo) ---------- */
function demo(){
  const ids = ['25','425618','64138','30259','81274','86','58127','1902'];
  const noms = ['CapitaineCroquette','MoussaillonDu57','Barbe_Rousse','LaPerleNoire','ToutouPirate'];

  setTimeout(faux, 2500); setInterval(faux, 19000);

  const ecr = () => { fileEcran.push({ nom:'MoussaillonDu57', texte:'Salut depuis le fond du stream, les toutous vous saluent !', user:'demo' }); if (!ecranCourant) ecranSuivant(); };
  setTimeout(ecr, 11000); setInterval(ecr, 25000);

/* ---------- démarrage ---------- */
ajusterEcran();
$('#t-titre').textContent = CONFIG.titre;
$('#t-sous').textContent = CONFIG.sousTitre;
$('#t-objectif').textContent = `objectif ${euros(CONFIG.objectif)}`;
appliquerPalette(CONFIG.ambiance);
construireDecor();

try { majButin(JSON.parse(stock.get('ecranPirate.butin') || 'null')); } catch(e){}
if (document.fonts) document.fonts.ready.then(majTresor);
majChrono(); setInterval(majChrono, 1000);
bandeauSuivant(); setInterval(bandeauSuivant, 9000);

else { initChat(); initStreamlabs(); }
